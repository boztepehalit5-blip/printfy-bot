name: Daily Printify Drafts

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC (~10:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run draft generator
        env:
          PRINTIFY_API: ${{ secrets.PRINTIFY_API }}
          GEMINI_API_KEY: ${{ secrets.AI_API }}
        run: python get_ids.py
